[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-pc-windows-gnu" },
    { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
ignore = [
    { id = "RUSTSEC-2025-0134", reason = "Pinned Kyber kynet uses this PEM reader for local test credentials. Remove when upstream migrates to rustls-pki-types." },
]

[licenses]
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

# Kyber declares its dual license at the root of the pinned Git workspace.
[[licenses.clarify]]
crate = "kymux@0.1.0"
expression = "AGPL-3.0-or-later"
license-files = [{ path = "../COPYING.md", hash = 0x216c3358 }]

[[licenses.clarify]]
crate = "kymux-types@0.1.0"
expression = "AGPL-3.0-or-later"
license-files = [{ path = "../COPYING.md", hash = 0x216c3358 }]

[[licenses.clarify]]
crate = "kymux-util@0.1.0"
expression = "AGPL-3.0-or-later"
license-files = [{ path = "../COPYING.md", hash = 0x216c3358 }]

[[licenses.clarify]]
crate = "kynet@0.1.0"
expression = "AGPL-3.0-or-later"
license-files = [{ path = "../COPYING.md", hash = 0x216c3358 }]

[[licenses.clarify]]
crate = "kyproto@0.1.0"
expression = "AGPL-3.0-or-later"
license-files = [{ path = "../COPYING.md", hash = 0x216c3358 }]

[[licenses.clarify]]
crate = "kywebsocket@0.1.0"
expression = "AGPL-3.0-or-later"
license-files = [{ path = "../COPYING.md", hash = 0x216c3358 }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://gitlab.com/kyber/core/kymux.git"]
required-git-spec = "rev"
