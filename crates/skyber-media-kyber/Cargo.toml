[package]
name = "skyber-media-kyber"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
a1-native = ["tokio/process", "tokio/io-util"]
upstream-vlc-player = ["dep:kyvlcplayer", "dep:log", "kymux/ipc"]

[dependencies]
anyhow.workspace = true
bytes.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
getrandom.workspace = true
kymux.workspace = true
kyvlcplayer = { git = "https://gitlab.com/kyber/core/kyctl.git", rev = "92c632f9e889917a34aaa7697fb88b4991054b1c", package = "kyvlcplayer", optional = true }
log = { workspace = true, optional = true }
quinn.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
skyber-core.workspace = true
skyber-signaling = { path = "../skyber-signaling" }
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
zeroize.workspace = true
webrtc-ice.workspace = true
webrtc-util.workspace = true

[dev-dependencies]
rcgen = "=0.14.10"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls.workspace = true
futures-util = "=0.3.34"

[[bin]]
name = "skyber-a1-peer"
path = "src/bin/a1_peer.rs"
required-features = ["a1-native"]

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
