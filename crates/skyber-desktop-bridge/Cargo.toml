[package]
name = "skyber_desktop_bridge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[features]
qt = ["dep:cxx", "dep:cxx-qt", "dep:cxx-qt-build"]

[dependencies]
cxx = { version = "1", optional = true }
cxx-qt = { version = "=0.10.0", optional = true }

[build-dependencies]
cxx-qt-build = { version = "=0.10.0", optional = true }

[lints]
workspace = true
